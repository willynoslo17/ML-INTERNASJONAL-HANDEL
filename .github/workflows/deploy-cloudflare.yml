# Auto-deploy to Cloudflare on every push to main (and manual run).
# Repo secrets: CLOUDFLARE_ACCOUNT_ID (set) and CLOUDFLARE_API_TOKEN (pending).
# API token permissions: Account > Cloudflare Pages: Edit, Workers Scripts: Edit, D1: Edit, Account Settings: Read.
# Without CLOUDFLARE_API_TOKEN the job skips with a warning instead of failing.
name: Deploy Cloudflare Pages (ml-internasjonal-handel)
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Skip if Cloudflare secrets are missing
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "::warning::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repo secrets to enable auto-deploy."
      - uses: actions/checkout@v4
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
      - name: Build dist/ (site files only)
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: |
          mkdir -p dist && rsync -a --exclude .git --exclude .github --exclude dist --exclude "README*" ./ dist/
      - name: Deploy to Pages project ml-internasjonal-handel
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          workingDirectory: .
          command: pages deploy dist --project-name ml-internasjonal-handel --branch main --commit-dirty=true
