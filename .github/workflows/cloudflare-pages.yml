name: Deploy Cloudflare Pages

# Public production (mlinternasjonal.no) is Cloudflare Pages and is not
# git-connected. This workflow uploads index.html + apps/ to the existing
# project. Requires repo secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
# Manual equivalent:
#   npx wrangler pages deploy . --project-name ml-internasjonal-handel --branch main

on:
  # Push-to-main can be added after CLOUDFLARE_API_TOKEN and
  # CLOUDFLARE_ACCOUNT_ID are set; until then use workflow_dispatch.
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare Pages
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=ml-internasjonal-handel --branch=main
