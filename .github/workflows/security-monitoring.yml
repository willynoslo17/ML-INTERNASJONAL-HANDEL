name: Security monitoring

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  zap-baseline:
    name: "OWASP ZAP - ${{ matrix.site }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - site: mlinternasjonal
            url: https://mlinternasjonal.no
          - site: willymartinez
            url: https://willymartinez.no
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Run passive OWASP ZAP baseline
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: ${{ matrix.url }}
          allow_issue_writing: false
          fail_action: false
          artifact_name: "zap-${{ matrix.site }}"
      - name: Send OWASP result to main Make scenario
        if: ${{ vars.MAKE_SECURITY_ROUTE_READY == 'true' }}
        env:
          MAKE_SECURITY_WEBHOOK_URL: ${{ secrets.MAKE_SECURITY_WEBHOOK_URL }}
        shell: bash
        run: |
          set -euo pipefail
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          jq -n --arg site "${{ matrix.site }}" --arg url "${{ matrix.url }}" --arg run_url "$run_url" \
            '{event:"security.scan",site:$site,source:"OWASP ZAP",grade:"baseline",score:"",report_url:$run_url,run_url:$run_url,target_url:$url}' > payload.json
          curl --fail-with-body --retry 3 --max-time 30 --silent --show-error \
            --header "Content-Type: application/json" \
            --data-binary @payload.json "$MAKE_SECURITY_WEBHOOK_URL" > /dev/null

  mozilla-observatory:
    name: "Mozilla Observatory - ${{ matrix.site }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - site: mlinternasjonal
            host: mlinternasjonal.no
          - site: willymartinez
            host: willymartinez.no
    steps:
      - name: Run Mozilla Observatory scan
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --retry 3 --request POST             "https://observatory-api.mdn.mozilla.net/api/v2/scan?host=${{ matrix.host }}"             --output observatory.json
          {
            echo "## Mozilla Observatory: ${{ matrix.host }}"
            echo
            jq -r '"Grade: **\(.grade)**  |  Score: **\(.score)**  |  Passed: **\(.tests_passed)**  |  Failed: **\(.tests_failed)**"' observatory.json
            echo
            jq -r '"[Open full report](\(.details_url))"' observatory.json
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Observatory result
        uses: actions/upload-artifact@v4
        with:
          name: "mozilla-observatory-${{ matrix.site }}"
          path: observatory.json
          retention-days: 30
      - name: Send Observatory result to main Make scenario
        if: ${{ vars.MAKE_SECURITY_ROUTE_READY == 'true' }}
        env:
          MAKE_SECURITY_WEBHOOK_URL: ${{ secrets.MAKE_SECURITY_WEBHOOK_URL }}
        shell: bash
        run: |
          set -euo pipefail
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          jq --arg site "${{ matrix.host }}" --arg run_url "$run_url" \
            '{event:"security.scan",site:$site,source:"Mozilla Observatory",grade:(.grade // "unknown"),score:(.score // ""),report_url:(.details_url // $run_url),run_url:$run_url}' observatory.json > payload.json
          curl --fail-with-body --retry 3 --max-time 30 --silent --show-error \
            --header "Content-Type: application/json" \
            --data-binary @payload.json "$MAKE_SECURITY_WEBHOOK_URL" > /dev/null

  response-headers:
    name: "HTTP security headers - ${{ matrix.site }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - site: mlinternasjonal.no
            url: https://mlinternasjonal.no
          - site: willymartinez.no
            url: https://willymartinez.no
    steps:
      - name: Inspect response security headers
        shell: bash
        run: |
          set -euo pipefail
          curl --location --silent --show-error --max-time 30 \
            --dump-header headers.txt --output /dev/null \
            --write-out '%{http_code}' "${{ matrix.url }}" > status.txt
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          raw = Path("headers.txt").read_text(errors="replace").strip()
          final = re.split(r"\r?\n\r?\n", raw)[-1]
          headers = {}
          for line in final.splitlines():
              if ":" in line:
                  name, value = line.split(":", 1)
                  headers[name.strip().lower()] = value.strip()
          checks = {
              "content-security-policy": bool(headers.get("content-security-policy")),
              "strict-transport-security": bool(headers.get("strict-transport-security")),
              "x-content-type-options": bool(headers.get("x-content-type-options")),
              "referrer-policy": bool(headers.get("referrer-policy")),
              "permissions-policy": bool(headers.get("permissions-policy")),
              "frame-protection": bool(headers.get("x-frame-options")) or "frame-ancestors" in headers.get("content-security-policy", "").lower(),
          }
          status = int(Path("status.txt").read_text().strip())
          passed = sum(checks.values())
          grade = ("A" if passed >= 5 else "B" if passed == 4 else "C" if passed == 3 else "D" if passed == 2 else "F") if 200 <= status < 400 else "unreachable"
          report = {"site": "${{ matrix.site }}", "url": "${{ matrix.url }}", "http_status": status, "cloudflare_detected": bool(headers.get("cf-ray") or headers.get("server", "").lower() == "cloudflare"), "grade": grade, "score": round(100 * passed / len(checks)), "checks": checks, "missing": [name for name, ok in checks.items() if not ok]}
          Path("headers-report.json").write_text(json.dumps(report, indent=2))
          with open("${{ github.step_summary }}", "a") as out:
              out.write("## HTTP security headers: " + report["site"] + "\n\n")
              out.write("HTTP " + str(status) + " | Presence score " + str(report["score"]) + "/100 | Grade " + grade + "\n\n")
              out.write("Missing: " + (", ".join(report["missing"]) or "none") + "\n")
          PY
      - name: Upload header report
        uses: actions/upload-artifact@v4
        with:
          name: "http-headers-${{ matrix.site }}"
          path: headers-report.json
          retention-days: 30
      - name: Send header result to main Make scenario
        if: ${{ vars.MAKE_SECURITY_ROUTE_READY == 'true' }}
        env:
          MAKE_SECURITY_WEBHOOK_URL: ${{ secrets.MAKE_SECURITY_WEBHOOK_URL }}
        shell: bash
        run: |
          set -euo pipefail
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          jq --arg run_url "$run_url" '{event:"security.scan",site:.site,source:"HTTP security headers",grade:.grade,score:.score,report_url:$run_url,run_url:$run_url,http_status:.http_status,missing:.missing,cloudflare_detected:.cloudflare_detected}' headers-report.json > payload.json
          curl --fail-with-body --retry 3 --max-time 30 --silent --show-error \
            --header "Content-Type: application/json" \
            --data-binary @payload.json "$MAKE_SECURITY_WEBHOOK_URL" > /dev/null
